name: Build InfinityCoder (Windows installer)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ic-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: ic-cargo-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Rollup Windows native package
        run: npm install --no-save --package-lock=false --no-audit --no-fund @rollup/rollup-win32-x64-msvc@4.64.0

      - name: Download Vulkan llama.cpp runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri\bin" | Out-Null
          $urls = @(
            "https://github.com/Caerleus/llama.cpp-vulkan-win/releases/latest/download/llama-vulkan-windows.zip",
            "https://github.com/ggerganov/llama.cpp/releases/latest/download/llama-win-vulkan-x64.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              Write-Host "Downloading $u"
              Invoke-WebRequest -Uri $u -OutFile "$env:RUNNER_TEMP\llama.zip" -UseBasicParsing
              $ok = $true
              break
            } catch { Write-Host "failed: $($_.Exception.Message)" }
          }
          if (-not $ok) { throw "Could not download the llama.cpp runtime" }
          Expand-Archive "$env:RUNNER_TEMP\llama.zip" "$env:RUNNER_TEMP\llama" -Force
          $server = Get-ChildItem "$env:RUNNER_TEMP\llama" -Recurse -Filter "llama-server*.exe" |
                    Where-Object { $_.Length -gt 1MB } | Select-Object -First 1
          if (-not $server) { throw "llama-server.exe not found" }
          Copy-Item $server.FullName "src-tauri\bin\llama-server-vulkan-x86_64-pc-windows-msvc.exe" -Force
          Get-ChildItem $server.Directory -Filter "*.dll" | ForEach-Object {
            $d = Join-Path "src-tauri\bin" $_.Name
            if (-not (Test-Path $d)) { Copy-Item $_.FullName $d -Force }
          }
          $f = Get-Item "src-tauri\bin\llama-server-vulkan-x86_64-pc-windows-msvc.exe"
          Write-Host "llama-server: $($f.Length) bytes"
          if ($f.Length -lt 1MB) { throw "llama-server is unexpectedly small" }

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npx vite build

      - name: Generate icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $tmp = Join-Path $env:RUNNER_TEMP "ic-icon.png"
          $bmp = New-Object System.Drawing.Bitmap 1024,1024
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $bg = New-Object System.Drawing.Drawing2D.LinearGradientBrush(
            (New-Object System.Drawing.Point 0,0),
            (New-Object System.Drawing.Point 1024,1024),
            [System.Drawing.Color]::FromArgb(108,133,255),
            [System.Drawing.Color]::FromArgb(178,122,255))
          $g.FillEllipse($bg, 40, 40, 944, 944)
          $g.FillEllipse((New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(10,12,18))), 0, 0, 1024, 1024)
          $pen = New-Object System.Drawing.Pen ([System.Drawing.Color]::White), 74
          $pen.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $pen.EndCap = [System.Drawing.Drawing2D.LineCap]::Round
          $g.DrawEllipse($pen, 190, 380, 340, 264)
          $g.DrawEllipse($pen, 494, 380, 340, 264)
          $g.Dispose(); $bmp.Save($tmp, [System.Drawing.Imaging.ImageFormat]::Png); $bmp.Dispose()
          npx tauri icon $tmp

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" -ErrorAction SilentlyContinue |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "NSIS installer was not produced" }
          Write-Host "Installer: $($exe.FullName) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: InfinityCoder-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
